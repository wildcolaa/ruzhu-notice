<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>住进来的第三天 · 寓言公寓</title>
<style>
:root {
  color-scheme: light;
  --paper: #efe4c8;
  --paper-2: #e8d6a8;
  --ink: #2a2118;
  --ink-dim: #6a5844;
  --seal: #9c3b32;
  --amber: #c9842a;
  --teal: #2a6b66;
  --night: #0a0d14;
  --serif: "Songti SC", "Noto Serif CJK SC", "STSong", "SimSun", serif;
  --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --hand: "Kaiti SC", "STKaiti", "KaiTi", "Noto Serif CJK SC", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #070b16; color: var(--ink); font-family: var(--sans); overflow: hidden; }
button, input { font-family: inherit; }
#app { height: 100%; }
.viewport { position: relative; height: 100%; background: var(--night); }
#c { width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud > * { pointer-events: auto; }

/* 场记板：左上角 */
.slate {
  position: absolute; top: 16px; left: 16px;
  width: 168px; transform: rotate(-2.5deg);
  background: #1a1612; color: #efe4c8;
  border: 3px solid #0c0a08; box-shadow: 4px 6px 0 #0c0a08, 0 16px 30px rgba(0,0,0,.4);
}
.slate .clap { height: 14px; background: repeating-linear-gradient(90deg, #efe4c8 0 10px, #1a1612 10px 20px); }
.slate .body { padding: 8px 10px 10px; }
.slate .title { font-family: var(--serif); font-size: 13px; letter-spacing: .18em; }
.slate .meta { font-size: 10px; color: #c9b48a; margin-top: 4px; letter-spacing: .08em; }
.slate .clock { font-family: "SF Mono", Menlo, Consolas, monospace; color: #e0a24e; font-size: 16px; margin-top: 6px; }

/* 守则：钉着的纸条 */
.rulecard {
  position: absolute; top: 18px; left: 200px;
  width: min(280px, 32vw);
  background: #f3e6c4;
  padding: 18px 16px 14px;
  box-shadow: 2px 3px 0 rgba(42,33,24,.15), 0 10px 24px rgba(0,0,0,.25);
  transform: rotate(-1.4deg);
}
.rulecard::before {
  content: ""; position: absolute; left: 50%; top: -8px; width: 16px; height: 16px;
  margin-left: -8px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #eee, #8a2a24 55%, #4a1010);
  box-shadow: 0 2px 0 #2a1008;
}
.rulecard h2 { margin: 0 0 6px; font-family: var(--serif); font-size: 14px; }
.rulecard p { margin: 0; font-family: var(--hand); font-size: 13px; line-height: 1.55; color: var(--ink-dim); }
.seal {
  position: absolute; right: 8px; top: 8px;
  width: 42px; height: 42px; border-radius: 50%;
  border: 2px solid var(--seal); color: var(--seal);
  display: grid; place-items: center;
  font-family: var(--serif); font-size: 10px;
  transform: rotate(12deg); opacity: .8;
}

/* 调查笔记：报纸拼贴 */
.clues {
  position: absolute; top: 16px; right: 16px;
  width: min(250px, 30vw); max-height: 48%;
  overflow: auto;
  background: #f6ead0;
  padding: 14px 14px 10px;
  box-shadow: 3px 4px 0 rgba(42,33,24,.12), 0 12px 28px rgba(0,0,0,.28);
  transform: rotate(1.8deg);
}
.clues::after {
  content: ""; position: absolute; left: 18px; top: -7px; width: 42px; height: 16px;
  background: rgba(220, 190, 80, .45); transform: rotate(-6deg);
}
.clues h3 { margin: 0 0 8px; font-family: var(--serif); font-size: 13px; }
.clues ul { margin: 0; padding: 0; list-style: none; }
.clues li {
  font-family: var(--hand); font-size: 12px; line-height: 1.45;
  margin: 0 0 8px; padding: 6px 8px;
  background: #fff8e4; box-shadow: 1px 1px 0 rgba(42,33,24,.12);
  transform: rotate(-0.6deg);
}
.clues li:nth-child(even) { transform: rotate(0.8deg); background: #fff3d0; }

/* 左下角：角色徽章 + 进度 */
.hero {
  position: absolute; left: 16px; bottom: 16px;
  display: flex; align-items: flex-end; gap: 12px;
}
.badge {
  width: 92px; height: 92px; border-radius: 50%;
  background: #1c1814; border: 4px solid #efe4c8;
  box-shadow: 0 8px 20px rgba(0,0,0,.45), inset 0 0 0 3px #1c1814;
  overflow: hidden; position: relative;
}
.badge canvas, .badge img { width: 100%; height: 100%; display: block; object-fit: cover; }
.progress {
  width: 168px;
}
.progress .bar {
  height: 10px; background: #1c1814; border: 2px solid #efe4c8;
  box-shadow: 2px 2px 0 #0c0a08;
}
.progress .fill { height: 100%; background: #c45c4a; width: 0%; transition: width .4s; }
.progress .label { font-family: var(--serif); font-size: 11px; color: #efe4c8; margin-top: 4px; text-shadow: 0 1px 4px #000; }

/* NPC 按钮做成印章 */
.dock { position: absolute; left: 300px; bottom: 22px; display: flex; gap: 8px; flex-wrap: wrap; max-width: 42vw; }
.npcbtn, .toolbtn {
  border: 2px dashed #c9b48a; background: #efe4c8; color: var(--ink);
  padding: 7px 11px; font-size: 12px; font-family: var(--serif); cursor: pointer;
  box-shadow: 2px 2px 0 rgba(42,33,24,.2);
}
.npcbtn:hover, .toolbtn:hover { border-color: var(--seal); color: var(--seal); }
.npcbtn:focus-visible, .toolbtn:focus-visible, .choices button:focus-visible, .primary:focus-visible, .tile:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.npcbtn[disabled] { opacity: .35; cursor: default; }

/* 今日目标：便签 */
.obj {
  position: absolute; right: 18px; bottom: 18px;
  width: min(240px, 32vw);
  background: #fff3a0;
  padding: 16px 14px 12px;
  box-shadow: 2px 4px 0 rgba(42,33,24,.12), 0 10px 22px rgba(0,0,0,.22);
  transform: rotate(2.2deg);
}
.obj::before {
  content: ""; position: absolute; left: 50%; top: -9px; width: 28px; height: 14px; margin-left: -14px;
  background: rgba(255,80,80,.45); transform: rotate(-8deg);
}
.obj h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 13px; }
.obj p { margin: 0; font-family: var(--hand); font-size: 12px; line-height: 1.5; color: var(--ink); }

.prompt {
  position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
  background: #1c1814; color: #efe4c8;
  padding: 8px 16px; font-size: 13px; font-family: var(--serif);
  pointer-events: none; opacity: 0; transition: opacity .2s;
  box-shadow: 3px 3px 0 #0c0a08;
}
.prompt.show { opacity: 1; }
#toast {
  position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
  background: #efe4c8; color: var(--seal); border: 2px solid var(--seal);
  padding: 8px 14px; font-size: 13px; font-family: var(--serif);
  opacity: 0; transition: opacity .3s; pointer-events: none;
}
#toast.show { opacity: 1; }

.modal {
  position: absolute; inset: 0; z-index: 30;
  background: radial-gradient(ellipse at center, rgba(7,11,22,.3), rgba(7,11,22,.82));
  display: none; place-items: center; padding: 24px;
}
.modal.show { display: grid; }
.sheet {
  background: var(--paper); color: var(--ink);
  width: min(720px, 94vw); max-height: 86vh; overflow: auto;
  padding: 32px 36px 24px;
  border: 1px solid #d7c9a8;
  box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 60px rgba(120,90,40,.14);
  background-image: repeating-linear-gradient(0deg, rgba(42,33,24,.035) 0 1px, transparent 1px 28px);
  position: relative;
}
.sheet::before {
  content: "CASE FILE"; position: absolute; top: 10px; right: 14px;
  font-family: var(--serif); font-size: 10px; letter-spacing: .28em; color: var(--seal); opacity: .55;
}
.sheet h1, .sheet h2 { font-family: var(--serif); font-weight: 600; margin: 0 0 12px; }
.sheet p { line-height: 1.7; font-size: 14px; }
.choices { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.choices button, .primary {
  text-align: left; background: transparent; border: 1px solid rgba(42,33,24,.18);
  padding: 10px 12px; cursor: pointer; color: var(--ink); font-size: 14px;
}
.choices button:hover, .primary:hover { border-color: var(--seal); color: var(--seal); }
.primary { display: inline-block; margin-top: 12px; }
.chatlog { max-height: 220px; overflow: auto; font-size: 14px; line-height: 1.65; }
.chatlog .who { font-family: var(--serif); color: var(--teal); }
.chatlog .me { color: var(--seal); }
.row { display: flex; gap: 8px; margin-top: 12px; }
.mic {
  width: 42px; border: 1px solid rgba(42,33,24,.18); background: #f7f0e0; cursor: pointer;
  font-size: 18px; line-height: 1; touch-action: none;
}
.mic:hover { border-color: var(--seal); }
.mic.rec { background: var(--seal); color: #fff; border-color: var(--seal); animation: recpulse 1s ease-in-out infinite; }
@keyframes recpulse { 50% { box-shadow: 0 0 0 6px rgba(156,59,50,.25); } }
@media (prefers-reduced-motion: reduce) { .mic.rec { animation: none; } }
.keyhint { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); font-family: var(--serif); font-size: 12px; color: #c9b48a; text-shadow: 0 1px 4px #000; pointer-events: none; }
.row input { flex: 1; border: 1px solid rgba(42,33,24,.18); background: #f7f0e0; padding: 10px 12px; color: var(--ink); font-size: 14px; }
.gridp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border: 1px solid rgba(42,33,24,.18); padding: 12px; cursor: pointer; background: #f7f0e0; font-size: 13px; min-height: 64px; }
.tile.on { outline: 2px solid var(--teal); }
.hint { font-size: 12px; color: var(--ink-dim); margin-top: 8px; }
.ending { font-family: var(--serif); }
.ending .city { font-size: 15px; color: var(--ink-dim); }
.titlemark {
  width: 72px; height: 72px; border: 2px solid var(--seal); border-radius: 50%;
  display: grid; place-items: center; color: var(--seal);
  font-family: var(--serif); letter-spacing: .2em; margin-bottom: 18px;
}
@media (max-width: 820px) {
  .clues, .obj, .rulecard { display: none; }
  .dock { left: 120px; max-width: 60vw; }
}

/* ============================================================
   终端主题：所有 HUD 和弹窗统一成「住家」系统的荧光显示屏
   黑绿玻璃屏 + 灰色机框 + 扫描线 + 荧光字；覆盖上面的纸张样式
   ============================================================ */
:root {
  --scr: #060b0b;            /* 屏幕底色 */
  --scr-2: #0b1514;
  --bezel: #3c4247;          /* 机框 */
  --bezel-hi: #6a7378;
  --bezel-lo: #1d2124;
  --ph: #8ff5d2;             /* 荧光主色 */
  --ph-hi: #e4fff5;
  --ph-dim: #4fae92;
  --ph-faint: rgba(143,245,210,.16);
  --ph-glow: 0 0 6px rgba(90,255,210,.45), 0 0 16px rgba(40,180,150,.25);
  --warn: #ffb08f;
  --warn-glow: 0 0 6px rgba(255,130,90,.5);
  --mono: "SF Mono", Menlo, "Cascadia Mono", Consolas, "PingFang SC", "Noto Sans CJK SC", monospace;
}
/* 一块屏：机框 + 玻璃 + 扫描线。所有面板共用 */
.slate, .rulecard, .clues, .obj, .sheet, .prompt, #toast, .hero {
  --pad: 12px;
  background:
    repeating-linear-gradient(180deg, rgba(0,0,0,.26) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 35%, var(--scr-2) 0%, var(--scr) 75%);
  color: var(--ph);
  border: 0; border-radius: 10px;
  box-shadow:
    0 0 0 3px var(--bezel),
    0 0 0 4px var(--bezel-lo),
    0 -1px 0 4px var(--bezel-hi),
    inset 0 0 0 1px rgba(143,245,210,.08),
    inset 0 0 28px rgba(0,0,0,.85),
    0 14px 30px rgba(0,0,0,.5);
  text-shadow: var(--ph-glow);
  font-family: var(--mono);
  transform: none;
}
/* 玻璃高光 + 暗角，叠在内容上但不挡点击 */
.slate::after, .rulecard::after, .clues::before, .obj::after, .sheet::after, .hero::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background:
    linear-gradient(160deg, rgba(190,255,235,.07) 0 12%, transparent 34%),
    radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.5) 100%);
}
/* 面板顶部的小标题：像屏幕上方的系统栏 */
.term-h {
  font: 600 10px/1 var(--mono); letter-spacing: .26em; color: var(--ph-dim);
  display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
}
.term-h::after { content: ""; flex: 1; height: 1px; background: var(--ph-faint); }

/* ---- 左上：状态屏（替代场记板）---- */
.slate { top: 16px; left: 16px; width: 176px; padding: 11px 13px 12px; }
.slate .clap { display: none; }
.slate .body { padding: 0; }
.slate .title { font: 600 10px/1.2 var(--mono); letter-spacing: .22em; color: var(--ph-dim); text-shadow: none; }
.slate .meta { font-size: 11px; color: var(--ph); margin-top: 7px; letter-spacing: .1em; }
.slate .clock { font: 600 30px/1 var(--mono); letter-spacing: .06em; color: var(--ph-hi); margin-top: 6px; }
.slate .clock::after { content: "_"; animation: blink 1.1s steps(1) infinite; margin-left: 2px; }
@keyframes blink { 50% { opacity: 0; } }

/* ---- 守则屏 ---- */
.rulecard { top: 16px; left: 212px; width: min(290px, 32vw); padding: 12px 46px 13px 14px; }
.rulecard::before { content: none; }
.rulecard h2 { font: 600 10px/1 var(--mono); letter-spacing: .26em; color: var(--warn); text-shadow: var(--warn-glow); margin: 0 0 8px; }
.rulecard p { font: 13px/1.6 var(--mono); color: var(--ph); }
.seal { width: auto; height: auto; border: 1px solid var(--warn); border-radius: 3px; padding: 2px 5px; right: 10px; top: 9px;
  color: var(--warn); font: 600 9px/1.2 var(--mono); letter-spacing: .1em; text-shadow: var(--warn-glow); transform: none; opacity: .9; text-align: center; }

/* ---- 调查记录屏 ---- */
.clues { top: 16px; right: 16px; width: min(270px, 30vw); max-height: 48%; padding: 12px 12px 8px; }
.clues::after { content: none; }
.clues h3 { font: 600 10px/1 var(--mono); letter-spacing: .26em; color: var(--ph-dim); text-shadow: none; margin: 0 0 10px; display: flex; gap: 8px; align-items: center; }
.clues h3::after { content: ""; flex: 1; height: 1px; background: var(--ph-faint); }
.clues li { font: 12px/1.5 var(--mono); color: var(--ph); background: transparent; box-shadow: none; transform: none;
  padding: 0 0 0 14px; margin: 0 0 7px; position: relative; }
.clues li::before { content: ">"; position: absolute; left: 0; color: var(--ph-dim); }
.clues li:nth-child(even) { transform: none; background: transparent; }
.clues li:last-child { color: var(--ph-hi); }

/* ---- 今日目标屏 ---- */
.obj { right: 16px; bottom: 16px; width: min(260px, 32vw); padding: 12px 14px 12px; }
.obj::before { content: none; }
.obj h3 { font: 600 11px/1.3 var(--mono); letter-spacing: .12em; color: var(--ph-hi); margin: 0 0 8px; }
.obj p { font: 12px/1.65 var(--mono); color: var(--ph); }

/* ---- 左下：头像 + 进度，合成一块小屏 ---- */
.hero { left: 16px; bottom: 16px; padding: 10px 12px 10px 10px; display: flex; align-items: center; gap: 12px; }
/* 头像保持原色，只加一圈荧光细边 */
.badge { border: 0; background: #1a1612; box-shadow: 0 0 0 1px rgba(143,245,210,.35), 0 0 12px rgba(80,255,210,.18); filter: none; }
.progress .bar { background: rgba(143,245,210,.08); border: 1px solid var(--ph-faint); height: 8px; border-radius: 1px; }
.progress .fill { background: repeating-linear-gradient(90deg, var(--ph) 0 6px, transparent 6px 8px); box-shadow: 0 0 8px rgba(80,255,210,.5); }
.progress .label { font: 11px/1 var(--mono); letter-spacing: .1em; color: var(--ph); text-shadow: var(--ph-glow); margin-top: 6px; }

/* ---- 底部按键：机身上的实体键 ---- */
.dock { left: auto; right: auto; left: 50%; transform: translateX(-50%); bottom: 18px; max-width: 56vw; justify-content: center; gap: 10px; }
.npcbtn, .toolbtn, .choices button, .primary, .row button:not(.mic), .sheet button.send {
  font: 600 12px/1 var(--mono); letter-spacing: .14em; color: var(--ph);
  background: linear-gradient(180deg, #121c1b, #0a1110);
  border: 1px solid rgba(143,245,210,.32); border-radius: 3px;
  padding: 10px 14px; cursor: pointer; text-shadow: var(--ph-glow);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 2px 0 #000, 0 0 0 3px var(--bezel), 0 0 0 4px var(--bezel-lo);
  transition: background .12s, color .12s, box-shadow .12s;
}
.npcbtn:hover, .toolbtn:hover, .choices button:hover, .primary:hover, .row button:not(.mic):hover {
  color: var(--scr); background: var(--ph); text-shadow: none; border-color: var(--ph);
  box-shadow: 0 0 14px rgba(90,255,210,.45), 0 0 0 3px var(--bezel), 0 0 0 4px var(--bezel-lo);
}
.npcbtn:active, .toolbtn:active, .choices button:active, .row button:not(.mic):active { transform: translateY(1px); }
.npcbtn:focus-visible, .toolbtn:focus-visible, .choices button:focus-visible, .primary:focus-visible, .tile:focus-visible, .row button:focus-visible {
  outline: 2px solid var(--ph-hi); outline-offset: 5px;
}
.npcbtn { color: var(--ph-hi); }

/* ---- 悬停标签、提示 ---- */
.prompt { padding: 8px 16px; font: 13px/1 var(--mono); letter-spacing: .08em; bottom: 78px; border-radius: 4px; }
.prompt::before { content: "› "; color: var(--ph-dim); }
#toast { padding: 9px 16px; font: 13px/1 var(--mono); color: var(--warn); text-shadow: var(--warn-glow); border-radius: 4px; top: 18px; }
#toast::before { content: "● "; animation: blink 1s steps(1) infinite; }
.keyhint { font-family: var(--mono) !important; color: rgba(143,245,210,.55) !important; text-shadow: 0 1px 3px #000; letter-spacing: .08em; }

/* ---- 弹窗：大屏 ---- */
.modal { background: radial-gradient(ellipse at center, rgba(3,6,8,.25), rgba(3,6,8,.78)); }
.sheet {
  width: min(760px, 94vw); padding: 28px 34px 26px; border-radius: 14px;
  box-shadow:
    0 0 0 8px var(--bezel), 0 0 0 9px var(--bezel-lo), 0 -1px 0 9px var(--bezel-hi),
    inset 0 0 0 1px rgba(143,245,210,.08), inset 0 0 50px rgba(0,0,0,.9),
    0 30px 70px rgba(0,0,0,.65);
  scrollbar-color: var(--ph-dim) transparent;
}
.sheet::before {
  content: "住家 · FABLE"; top: 12px; right: 18px;
  font: 600 9px/1 var(--mono); letter-spacing: .3em; color: var(--ph-dim); opacity: .8; text-shadow: none;
}
.sheet h1, .sheet h2 {
  font: 600 20px/1.3 var(--mono); letter-spacing: .1em; color: var(--ph-hi); margin: 0 0 16px;
  text-transform: uppercase;
}
.sheet h1 { font-size: 26px; }
.sheet p { font: 14px/1.85 var(--mono); color: var(--ph); margin: 0 0 12px; }
.sheet b { color: var(--ph-hi); font-weight: 600; }
.sheet a { color: var(--ph-hi); }
.sheet code, .sheet kbd { color: var(--ph-hi); border: 1px solid var(--ph-faint); padding: 0 4px; border-radius: 2px; font-family: var(--mono); }
.sheet .hint, .hint { color: var(--ph-dim) !important; text-shadow: none; }
.sheet hr { border: 0; border-top: 1px dashed var(--ph-faint); margin: 16px 0; }
/* 选项按钮：横排，像参考图下方那排键 */
.choices { flex-direction: row; flex-wrap: wrap; gap: 14px; margin-top: 22px; }
.choices button { flex: 1 1 160px; text-align: center; padding: 13px 14px; min-height: 44px; }
/* 打字机光标 */
.typing::after { content: "▌"; animation: blink .9s steps(1) infinite; margin-left: 2px; color: var(--ph-hi); }

/* ---- 对话框 ---- */
.chatlog { max-height: 260px; font: 14px/1.75 var(--mono); color: var(--ph); padding-right: 6px; scrollbar-color: var(--ph-dim) transparent; }
.chatlog .who { font-family: var(--mono); color: var(--ph-hi); }
.chatlog .me { color: var(--warn); text-shadow: var(--warn-glow); }
.sheet input, .sheet select, .sheet textarea {
  background: rgba(0,0,0,.45) !important; color: var(--ph-hi) !important;
  border: 1px solid rgba(143,245,210,.3) !important; border-radius: 3px;
  font: 14px/1.4 var(--mono) !important; padding: 11px 12px !important; caret-color: var(--ph-hi);
  text-shadow: var(--ph-glow);
}
.sheet input::placeholder { color: rgba(143,245,210,.4); text-shadow: none; }
.sheet input:focus, .sheet select:focus { outline: none; border-color: var(--ph) !important; box-shadow: 0 0 0 1px var(--ph), 0 0 12px rgba(90,255,210,.25); }
.mic {
  background: linear-gradient(180deg, #121c1b, #0a1110) !important; color: var(--ph) !important;
  border: 1px solid rgba(143,245,210,.32) !important; border-radius: 3px;
}

/* ---------- 开场：住家终端（横版） ---------- */

@keyframes crtNoise { 0% { transform: translate(0, 0); } 33% { transform: translate(-5%, 3%); } 66% { transform: translate(4%, -4%); } 100% { transform: translate(0, 0); } }
.crt-scan, .crt-vignette, .crt-glass, .crt-flicker { position: absolute; inset: 0; pointer-events: none; }
.crt-scan { background: repeating-linear-gradient(180deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); opacity: .55; }

.boot-hint { font-family: var(--serif); font-size: 12px; color: #a9b6ba; letter-spacing: .14em; text-shadow: 0 1px 3px #000; pointer-events: none; }
.knob {
  position: absolute; z-index: 4; cursor: grab;

  border-radius: 50%; background: transparent; border: 0; padding: 0;

.knob-ptr::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 46%; border-radius: 99px; background: linear-gradient(90deg, #c9d2d8, #ffffff 45%, #b8c2c8); box-shadow: 0 0 6px rgba(255,255,255,.55), 0 1px 1px rgba(0,0,0,.4); }

.k-lab, .r-lab, .keys-lab, .v-lab, .p-lab {

}

.led.on i { background: #6fffd0; box-shadow: 0 0 6px #4dffc4, 0 0 14px #1a8a70; animation: ledPulse 2.4s ease-in-out infinite; }
@keyframes ledPulse { 50% { box-shadow: 0 0 3px #4dffc4, 0 0 6px #1a8a70; } }
.led:focus-visible, .round:focus-visible { outline: 2px solid #7dffd4; outline-offset: 3px; }
.round { position: absolute; z-index: 4; left: 89.7%; top: 69.8%; width: 2.4%; height: 3.74%; border-radius: 50%; border: 0; background: transparent; cursor: pointer; }
.round:hover { box-shadow: 0 0 10px rgba(124,255,212,.55); }

.keys-lab { left: 83.15%; top: 79.6%; width: 11%; display: flex; align-items: center; gap: .5em; font-size: .85cqw; letter-spacing: .24em; color: #9aa4a8; }
.keys-lab::before, .keys-lab::after { content: ""; flex: 1; height: 1px; background: #7d868a; }
.key { position: absolute; z-index: 4; border: 0; background: transparent; padding: 0; color: #e8f4f0; font-family: var(--serif); font-size: 12px; font-size: 1.1cqw; letter-spacing: .2em; cursor: pointer; text-shadow: 0 1px 2px #000; }
.key:hover { color: #b8ffe8; }
.key:focus-visible { outline: 2px solid #7dffd4; outline-offset: 2px; }
.key[disabled] { color: #848c90; cursor: default; text-shadow: none; }

.key:active { transform: translateY(1px); }
.key-in { left: 83.15%; top: 83.9%; width: 5.03%; height: 4.49%; }
.key-out { left: 89.14%; top: 83.9%; width: 5.03%; height: 4.49%; }
.v-lab { left: 6.07%; top: 91.6%; font-size: .78cqw; letter-spacing: .26em; color: #8d979b; font-family: "SF Mono", Menlo, monospace; }
/* 控制条左侧：刻印的设备名和状态读数 */
.p-lab { left: 6.07%; top: 66.4%; color: #aeb7bb; font-size: .95cqw; letter-spacing: .3em; }
.p-lab b { display: block; margin-top: .9em; font: 600 1.25em/1 "SF Mono", Menlo, monospace; letter-spacing: .12em; color: #7fe9c8; text-shadow: 0 0 6px rgba(80,255,210,.35); }
#boot.off { animation: bootFade .7s forwards; }
#boot.off .crt { animation: crtOff .7s forwards; }

@keyframes crtOff { 0% { transform: none; filter: brightness(1); } 45% { transform: scaleY(.018); filter: brightness(3.2); } 72% { transform: scaleY(.018) scaleX(.02); filter: brightness(6); } 100% { transform: scaleY(.018) scaleX(.02); opacity: 0; filter: brightness(0); } }
@keyframes crtFade { to { opacity: 0; } }
@keyframes bootFade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
@media (max-width: 720px) {

/* ---- 规则怪谈：须知列表、违规、熄灯 ---- */

.rk-list li.rk-false .rk-note { display: inline-block; margin-left: 6px; }
.rk-strikes { margin-top: 8px; font: 600 10px/1 var(--mono); letter-spacing: .2em; color: var(--warn); text-shadow: var(--warn-glow); }
.rk-red { color: #ff6d5e; font-family: var(--hand); text-shadow: 0 0 6px rgba(255,80,60,.35); }
.rk-stamp { position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%) rotate(-6deg); z-index: 40; pointer-events: none;
  font: 700 42px/1 var(--mono); letter-spacing: .2em; color: #ff5544; border: 4px solid #ff5544; padding: 10px 22px; border-radius: 6px;
  text-shadow: 0 0 18px rgba(255,60,40,.7); box-shadow: 0 0 24px rgba(255,60,40,.4); animation: rkstamp 2.6s ease-out forwards; }
@keyframes rkstamp { 0% { opacity: 0; transform: translate(-50%,-50%) rotate(-6deg) scale(1.6); } 12% { opacity: 1; transform: translate(-50%,-50%) rotate(-6deg) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }

@keyframes rkglitch { 0%,100% { filter: none; transform: none; } 25% { filter: hue-rotate(90deg) contrast(1.4); transform: translateX(-4px) skewX(2deg); } 50% { filter: invert(.15); transform: translateX(3px); } 75% { filter: saturate(0); transform: translateX(-2px) skewX(-1deg); } }
#app.rk-flick canvas { animation: rkflick .9s steps(1); }
@keyframes rkflick { 0%,30%,60% { filter: brightness(.15); } 15%,45% { filter: none; } 100% { filter: brightness(.05); } }
#rkDark { position: absolute; inset: 0; z-index: 25; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: radial-gradient(circle 70px at var(--px,50%) var(--py,50%), rgba(0,0,0,.55), rgba(0,0,0,.985) 100%); }

.rk-whisper { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); font: 16px/1.4 var(--hand); color: #9a3b32; text-shadow: 0 0 10px rgba(200,40,30,.6); animation: rkwh 3s ease-in-out infinite; }

/* ---- 左下：软盘标签 ----
   排版按参考软盘等比缩放（参考图盘身 750px 宽 → 300px，系数 0.4），底部裁到写保护孔下方。
   左：深色标签；中：快门窗，里面是一张光碟（盘片、暗色圆环、盘心都以同一个圆心画同心圆）；
   右：铅笔侧颜，后脑勺压在快门窗后面；左下：黑色外套斜切过下巴。
   亮色统一用全局的荧光暗绿（--ph 系列）。 */
.hero.disk {
  --dk-body: #141a18; --dk-acc: var(--ph); --dk-acc-dim: var(--ph-dim); --dk-tagbg: #0f3a2f;
  --hx: 146px; --hy: 178px;   /* 盘心（光碟圆心） */
  left: 16px; bottom: 16px; width: 300px; height: 222px; padding: 0; display: block;
  background: repeating-linear-gradient(180deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px), radial-gradient(ellipse at 62% 40%, #1c2522, var(--dk-body) 75%);
  color: var(--ph); text-shadow: none; border-radius: 0;
  clip-path: path("M0 3 Q0 0 3 0 L188 0 L188 4 L196 4 L196 0 L290 0 Q300 0 300 10 L300 222 L0 222 Z");
  box-shadow: inset 0 0 0 1px rgba(143,245,210,.22), inset 0 0 36px rgba(0,0,0,.75);
  filter: drop-shadow(0 10px 22px rgba(0,0,0,.6)); overflow: hidden; isolation: isolate;
  transform: scale(.78); transform-origin: left bottom;
}
.hero.disk::after { content: none; }
/* 玻璃高光 + 暗角，和其它面板一致 */
.hero.disk::before { content: ""; position: absolute; inset: 0; z-index: 9; pointer-events: none;
  background: linear-gradient(160deg, rgba(190,255,235,.06) 0 12%, transparent 34%), radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.45) 100%); }
.dk-face { position: absolute; inset: 0; z-index: 1; background: left top / 100% 100% no-repeat; border: 0; border-radius: 0; box-shadow: none; }
.dk-face img { display: none; }
.dk-grunge { position: absolute; inset: 0; z-index: 2; background: left top / 100% 100% no-repeat; }
.dk-band { position: absolute; left: 5px; top: 0; width: 135px; height: 22px; z-index: 3;
  background: repeating-linear-gradient(90deg, #0d1110 0 9px, #161c1a 9px 13px, #0a0d0c 13px 21px); opacity: .95; }
/* 左侧深色标签 */
.dk-label { position: absolute; left: 5px; top: 0; width: 77px; height: 214px; z-index: 4; background: #0b0f0e; box-shadow: inset 0 0 0 1px rgba(143,245,210,.12); }
.dk-arrow { position: absolute; top: 12px; left: 50%; margin-left: -6px; width: 12px; height: 16px; background: var(--dk-acc);
  clip-path: polygon(50% 0, 100% 48%, 68% 48%, 68% 100%, 32% 100%, 32% 48%, 0 48%); filter: drop-shadow(0 0 3px rgba(80,255,210,.6)); }
.dk-inner { position: absolute; left: 7px; right: 5px; top: 34px; bottom: 8px; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(143,245,210,.28);
  display: flex; flex-direction: column; align-items: center; padding: 16px 4px 5px; box-sizing: border-box; }
.dk-title { width: 56px; image-rendering: pixelated; filter: drop-shadow(0 0 3px rgba(80,255,210,.45)); }
.dk-code { margin-top: 8px; font: 600 8px/1 var(--mono); letter-spacing: .1em; color: var(--dk-acc); text-shadow: var(--ph-glow); white-space: nowrap; }
.dk-tag { margin-top: auto; width: 100%; box-sizing: border-box; padding: 5px 3px 5px; border-radius: 6px; text-align: center;
  background: radial-gradient(ellipse at 50% 30%, #17503f, var(--dk-tagbg)); box-shadow: inset 0 0 0 1px rgba(143,245,210,.35), 0 0 8px rgba(80,255,210,.18);
  color: var(--dk-acc); text-shadow: var(--ph-glow); }
.dk-n { font: 700 20px/1 "DIN Condensed", "Arial Narrow", var(--mono); white-space: nowrap; }
.dk-sub { font: 600 9px/1.2 var(--mono); letter-spacing: .06em; margin-top: 3px; color: var(--dk-acc-dim); }
.dk-bar { height: 2px; margin-top: 4px; background: rgba(143,245,210,.12); }
.dk-fill { height: 100%; width: 0; background: var(--dk-acc); box-shadow: 0 0 4px rgba(80,255,210,.7); transition: width .5s; }
/* 快门窗外框（半透明塑料边） */
.dk-win { position: absolute; left: 90px; top: 22px; width: 96px; height: 210px; z-index: 5; border-radius: 8px 8px 0 0; pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(143,245,210,.35), inset 0 0 0 2px rgba(0,0,0,.4); background: rgba(10,16,14,.55); }
/* 快门窗上半：白底，露出光碟的上缘。光碟、暗色圆环都以盘心为圆心，所以看到的是同心圆弧 */
.dk-top { position: absolute; left: 93px; top: 25px; width: 90px; height: 131px; z-index: 6; border-radius: 6px 6px 0 0; overflow: hidden;
  background: radial-gradient(ellipse at 50% 0, #18231f, #0c1210); box-shadow: inset 0 0 12px rgba(0,0,0,.7); }
.dk-disc { position: absolute; left: calc(var(--hx) - 93px - 136px); top: calc(var(--hy) - 25px - 136px); width: 272px; height: 272px; border-radius: 50%;
  background: center / cover no-repeat #0d3329; box-shadow: 0 0 0 1px rgba(143,245,210,.25), 0 0 14px rgba(80,255,210,.2); animation: dkspin 40s linear infinite; }
.dk-ring { position: absolute; left: calc(var(--hx) - 93px - 50px); top: calc(var(--hy) - 25px - 50px); width: 100px; height: 100px; border-radius: 50%;
  background: radial-gradient(circle, #121816 0 70%, #26302c 71% 100%); box-shadow: 0 -1px 0 1px rgba(0,0,0,.5); }
/* 盘心：一圈一圈的同心圆 */
.dk-hub { position: absolute; left: calc(var(--hx) - 36px); top: calc(var(--hy) - 36px); width: 72px; height: 72px; z-index: 7; border-radius: 50%;
  background: radial-gradient(circle, #8ff5d2 0 5px, #4fae92 6px 7px, #050706 8px 11px, #222a27 12px 17px, #0e1311 18px 20px, #2f3a36 21px 27px, #141a18 28px 33px, #26302c 34px 36px);
  box-shadow: 0 1px 3px rgba(0,0,0,.5); }
.dk-hub::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 30deg, transparent 0 20%, rgba(255,255,255,.12) 22% 30%, transparent 32% 70%, rgba(255,255,255,.1) 72% 78%, transparent 80%); }
@keyframes dkspin { to { transform: rotate(360deg); } }
.dk-wp { display: none; }
/* 六份记录齐了：荧光更亮 */
.hero.disk.found { --dk-acc: var(--ph-hi); --dk-acc-dim: var(--ph); --dk-tagbg: #155443; }
.hero.disk.bump .dk-disc { animation: dkspin 40s linear infinite, dkbump .7s ease-out; }
@keyframes dkbump { 30% { filter: brightness(1.7) saturate(1.5); } }
@media (max-width: 1180px) { .hero.disk { transform: scale(.66); } }
@media (max-width: 820px) { .hero.disk { left: 6px; bottom: 6px; transform: scale(.5); } }
@media (prefers-reduced-motion: reduce) { .dk-disc, .hero.disk.bump .dk-disc { animation: none; } .dk-fill { transition: none; } }

/* ---- 手机：竖屏机身、刘海、状态栏、底部标签、Home 条 ---- */
.sheet.phone {
  width: min(340px, 92vw); height: min(680px, 88vh); max-height: none; padding: 0; overflow: hidden;
  display: flex; flex-direction: column; border-radius: 42px;
  box-shadow:
    0 0 0 3px #0d1110, 0 0 0 10px #1d2422, 0 0 0 11px #3a4542, 0 -1px 0 11px #56625e,
    inset 0 0 0 1px rgba(143,245,210,.1), inset 0 0 40px rgba(0,0,0,.85),
    0 30px 70px rgba(0,0,0,.7);
}
.sheet.phone::before { content: none; }
.sheet.phone::after { border-radius: 42px; }
/* 侧键 */
.ph-notch { position: relative; height: 30px; flex: none; display: grid; place-items: center; }
.ph-notch i { width: 96px; height: 24px; border-radius: 0 0 14px 14px; background: #0b0e0d; margin-top: -6px; box-shadow: inset 0 -1px 0 rgba(143,245,210,.08); position: relative; }
.ph-notch i::after { content: ""; position: absolute; right: 22px; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: #11201b; box-shadow: inset 0 0 0 2px #1a2a25; }
.ph-status { position: absolute; top: 9px; left: 30px; right: 26px; display: flex; justify-content: space-between; font: 600 12px/1 var(--mono); color: var(--ph); letter-spacing: .04em; z-index: 2; }
.ph-icons { display: flex; gap: 6px; align-items: center; }
.ph-icons svg { fill: currentColor; color: var(--ph); }
.ph-icons .ph-low { fill: var(--warn); animation: blink 1s steps(1) infinite; }
.ph-app { flex: none; padding: 10px 22px 10px; border-bottom: 1px solid var(--ph-faint); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.ph-app b { font: 700 18px/1 var(--mono); letter-spacing: .14em; color: var(--ph-hi); }
.ph-app span { font: 11px/1 var(--mono); color: var(--ph-dim); }
.ph-app .warn { font-style: normal; }
.ph-body { flex: 1; overflow: auto; padding: 14px 18px 10px; scrollbar-width: thin; scrollbar-color: var(--ph-dim) transparent; display: flex; flex-direction: column; }
.ph-body h3 { font: 600 11px/1.4 var(--mono); letter-spacing: .14em; color: var(--ph-dim); margin: 4px 0 10px; text-transform: uppercase; }
.ph-body h3 .hint { font: inherit; letter-spacing: .06em; text-transform: none; margin-left: 6px; opacity: .8; }
.ph-list { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ph-list li { font: 13px/1.6 var(--mono); color: var(--ph); padding: 9px 11px; border-radius: 12px; background: rgba(143,245,210,.06); box-shadow: inset 0 0 0 1px rgba(143,245,210,.14); }
.sheet.phone li { padding-left: 11px; }
.sheet.phone li::before { content: none; }
.ph-feed li time { display: block; font-size: 10px; color: var(--ph-dim); letter-spacing: .1em; margin-bottom: 2px; }
.ph-empty { color: var(--ph-dim) !important; background: none !important; box-shadow: none !important; text-align: center; font: 12px/1.6 var(--mono); }
.ph-body .rawlog { font-size: 11px; }
/* 小饱聊天：气泡 */
.ph-chat { flex: 1; max-height: none; display: flex; flex-direction: column; gap: 8px; padding: 2px 2px 8px; }
.ph-chat .bub { max-width: 80%; margin: 0; padding: 8px 12px; border-radius: 16px; font: 13px/1.55 var(--mono); }
.ph-chat .bub-it { align-self: flex-start; background: rgba(143,245,210,.09); color: var(--ph); border-bottom-left-radius: 4px; box-shadow: inset 0 0 0 1px rgba(143,245,210,.16); }
.ph-chat .bub-me { align-self: flex-end; background: var(--ph-dim); color: #04110d; text-shadow: none; border-bottom-right-radius: 4px; }
.sheet.phone .row { margin-top: 6px; }
.sheet.phone .row input { border-radius: 18px; padding-left: 14px; }
.sheet.phone .mic { border-radius: 50%; width: 40px; height: 40px; flex: none; }
.sheet.phone .ph-send { width: 40px; height: 40px; flex: none; border-radius: 50%; padding: 0; font: 700 16px/1 var(--mono); }
.sheet.phone #vstatus { margin: 4px 0 0; font-size: 11px; min-height: 0; }
/* 底部标签栏 + Home 条 */
.ph-tabs { flex: none; display: flex; border-top: 1px solid var(--ph-faint); padding: 6px 12px 4px; gap: 6px; }
.ph-tabs button { flex: 1; min-height: 40px; border: 0; background: transparent; border-radius: 12px; cursor: pointer;
  font: 600 12px/1 var(--mono); letter-spacing: .12em; color: var(--ph-dim); box-shadow: none; }
.ph-tabs button.on { color: var(--ph-hi); background: rgba(143,245,210,.08); text-shadow: var(--ph-glow); }
.ph-tabs button:hover { color: var(--ph); }
.ph-tabs button:focus-visible, .ph-home:focus-visible { outline: 2px solid var(--ph); outline-offset: 2px; }
.ph-home { flex: none; align-self: center; width: 120px; height: 5px; margin: 6px 0 10px; border: 0; padding: 0; border-radius: 3px; cursor: pointer;
  background: var(--ph-dim); box-shadow: 0 0 8px rgba(80,255,210,.35); }
.ph-home:hover { background: var(--ph); }
.ph-home::before { content: ""; display: block; margin: -10px 0; height: 25px; }   /* 放大点击区域 */

/* ---- 玄关旧电脑 ZL-0217：米色 CRT + 卧式主机 + 键盘（参考 90 年代 PC）---- */
#pc { position: absolute; inset: 0; z-index: 35; display: grid; place-items: center; pointer-events: auto;
  background: radial-gradient(ellipse at 50% 40%, rgba(10,14,13,.55), rgba(0,0,0,.92)); opacity: 0; transition: opacity .25s; }
#pc.on { opacity: 1; } #pc.off { opacity: 0; }
.pc-rig { --bg1: #e4ddc9; --bg2: #d3cbb4; --bg3: #b9b099; --edge: #a49a82;
  position: relative; width: min(760px, 94vw, calc(96vh * .92)); aspect-ratio: 760 / 830; display: flex; flex-direction: column; align-items: center;
  font-size: min(16px, 2.1vw, 1.95vh); transform: translateY(14px) scale(.97); transition: transform .3s ease-out; }
#pc.on .pc-rig { transform: none; }
/* 显示器 */
.pc-mon { width: 72%; aspect-ratio: 545 / 420; flex: none; overflow: hidden; position: relative; border-radius: 1.2em 1.2em .7em .7em; padding: 4.2% 4.6% 0;
  background: linear-gradient(180deg, var(--bg1), var(--bg2) 70%, var(--bg3)); box-shadow: inset 0 2px 0 rgba(255,255,255,.6), inset 0 -3px 0 rgba(0,0,0,.12), 0 18px 40px rgba(0,0,0,.55);
  display: flex; flex-direction: column; }
.pc-bezel { flex: 1; min-height: 0; border-radius: .9em; padding: 4.5%; background: linear-gradient(160deg, #cbc3ab, #e1dac6 40%, #c2b9a1);
  box-shadow: inset 0 3px 6px rgba(0,0,0,.25), inset 0 -2px 0 rgba(255,255,255,.5); }
.pc-crt { position: relative; height: 100%; border-radius: 1.6em / 1.3em; overflow: hidden; cursor: text;
  background: radial-gradient(ellipse at 50% 45%, #0e2a22, #061411 75%); box-shadow: inset 0 0 40px rgba(0,0,0,.9), inset 0 0 0 2px #191a16;
  padding: 1.1em 1.3em 2.6em; box-sizing: border-box; color: var(--ph); text-shadow: var(--ph-glow); font: .86em/1.5 var(--mono); }
.pc-out { position: absolute; left: 1.3em; right: 1.3em; top: 1.1em; bottom: 2.7em; overflow: auto; scrollbar-width: none; white-space: pre-wrap; word-break: break-all; }
.pc-out::-webkit-scrollbar { display: none; }
.pc-out .pl { min-height: 1.5em; }
.pc-out .ph { color: var(--ph-hi); letter-spacing: .08em; }
.pc-out .dim { color: var(--ph-dim); }
.pc-out .me { color: var(--ph-hi); }
.pc-out .warn { color: var(--warn); text-shadow: var(--warn-glow); }
.pc-out .ok { color: var(--ph-hi); }
.pc-out .ai { color: #bff9e4; }
.pc-line { position: absolute; left: 1.3em; right: 1.3em; bottom: .9em; display: flex; gap: .5em; align-items: center; z-index: 2; }
.pc-line span { color: var(--ph-hi); white-space: nowrap; }
.pc-line input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; padding: 0; font: inherit; color: var(--ph-hi); text-shadow: var(--ph-glow); caret-color: var(--ph-hi); caret-shape: block; }
#pc .crt-scan, #pc .crt-vignette, #pc .crt-glass { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.pc-chin { height: 11%; display: flex; align-items: center; gap: .9em; padding: 0 3%; font: 600 .62em/1 var(--mono); letter-spacing: .3em; color: #8a8270; }
.pc-chin span { margin-right: auto; }
.pc-btn { width: 1.6em; height: .5em; border-radius: .2em; background: var(--bg3); box-shadow: inset 0 1px 1px rgba(0,0,0,.3); }
.pc-pow { width: 1.6em; height: 1.6em; border-radius: .25em; cursor: pointer; background: linear-gradient(180deg, #ece6d4, #c9c1aa); box-shadow: 0 1px 0 rgba(0,0,0,.25), inset 0 0 0 1px var(--edge); position: relative; }
.pc-pow::after { content: ""; position: absolute; right: -.9em; top: .55em; width: .45em; height: .45em; border-radius: 50%; background: #5ad1b8; box-shadow: 0 0 6px #5ad1b8; }
.pc-neck { width: 30%; height: 2.4%; background: linear-gradient(180deg, var(--bg3), var(--bg2)); border-radius: 0 0 40% 40% / 0 0 100% 100%; box-shadow: 0 4px 6px rgba(0,0,0,.3); }
/* 主机 */
.pc-case { width: 82%; height: 16.5%; margin-top: -.2%; border-radius: .5em; display: flex; align-items: stretch; gap: 3%; padding: 2% 3%; box-sizing: border-box;
  background: linear-gradient(180deg, var(--bg1), var(--bg2) 60%, var(--bg3)); box-shadow: inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(0,0,0,.12), 0 14px 30px rgba(0,0,0,.5); }
.pc-vent { flex: 1; align-self: flex-end; height: 42%; background: repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, transparent 2px 6px); border-radius: .2em; }
.pc-bays { width: 26%; display: flex; flex-direction: column; gap: 6%; }
.pc-bays i { flex: 1; border-radius: .2em; background: linear-gradient(180deg, #e9e3d1, #cfc7b0); box-shadow: inset 0 0 0 1px var(--edge); position: relative; }
.pc-fd::after { content: ""; position: absolute; left: 22%; right: 30%; top: 40%; height: 20%; background: #2a2620; border-radius: 1px; }
.pc-cd::after { content: ""; position: absolute; left: 8%; right: 8%; top: 46%; height: 8%; background: rgba(0,0,0,.15); }
.pc-sw { width: 8%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10%; }
.pc-sw b { width: 50%; height: 34%; border-radius: .2em; background: #2a2724; box-shadow: inset 0 0 0 2px #e4ddc9, 0 0 0 1px var(--edge); }
.pc-led { width: .4em; height: .4em; border-radius: 50%; background: #3b4a42; }
.pc-led.on { background: #5ad1b8; box-shadow: 0 0 6px #5ad1b8; animation: pcHdd 1.6s steps(1) infinite; }
@keyframes pcHdd { 0%, 70% { opacity: 1; } 75%, 85% { opacity: .3; } }
/* 键盘 */
.pc-kb { width: 90%; margin-top: 2.6%; display: flex; gap: 2.5%; padding: 1.8% 2.2% 2.4%; box-sizing: border-box; border-radius: .6em .6em 1em 1em;
  background: linear-gradient(180deg, var(--bg2), var(--bg1) 20%, var(--bg2)); box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 4px 0 var(--bg3), 0 14px 26px rgba(0,0,0,.5);
  transform: perspective(900px) rotateX(18deg); transform-origin: 50% 0; }
.pk-main { flex: 15; display: flex; flex-direction: column; gap: .28em; }
.pk-num { flex: 4; display: flex; flex-direction: column; gap: .28em; }
.pk-row { display: flex; gap: .22em; }
.pk-fn { margin-bottom: .3em; }
.pk-leds { height: 1.75em; display: flex; justify-content: flex-end; gap: .9em; align-items: center; padding-right: .3em; margin-bottom: .3em; }
.pk-leds i { width: .4em; height: .4em; border-radius: 50%; background: #3b4a42; } .pk-leds i:first-child { background: #5ad1b8; box-shadow: 0 0 5px #5ad1b8; }
.pk, .pk-gap { flex: var(--w, 1) 1 0; min-width: 0; height: 1.75em; }
.pk-gap { flex: .5 1 0; }
.pk { display: grid; place-items: center; border-radius: .22em; font: 600 .5em/1 var(--mono); color: #6b6455; text-shadow: none; user-select: none; cursor: pointer; overflow: hidden; white-space: nowrap;
  background: linear-gradient(180deg, #f3eee0, #ddd6c2); box-shadow: 0 .18em 0 #b4ab93, 0 .22em .2em rgba(0,0,0,.25), inset 0 0 0 1px rgba(0,0,0,.06);
  transition: transform .05s, box-shadow .05s, background .05s; }
.pk-num .pk { height: 1.75em; }
.pk.down { transform: translateY(.16em); box-shadow: 0 .03em 0 #b4ab93, inset 0 0 0 1px rgba(0,0,0,.1); background: linear-gradient(180deg, #d9d2bd, #cbc3ad); color: #2f6b5a; }
.pk[data-code="Space"], .pk[data-code="Enter"], .pk[data-code="ShiftLeft"], .pk[data-code="ShiftRight"], .pk[data-code="Backspace"] { background: linear-gradient(180deg, #e2dbc7, #ccc4ad); }
.pc-mouse { position: absolute; right: 1.5%; bottom: 1.5%; width: 8%; aspect-ratio: 1 / 1.45; border-radius: 45% 45% 48% 48%; background: linear-gradient(180deg, #ece6d4, #cfc7b0);
  box-shadow: 0 6px 12px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.6); }
.pc-mouse i { position: absolute; left: 50%; top: 0; height: 36%; width: 1px; background: rgba(0,0,0,.18); }
.pc-mouse::before { content: ""; position: absolute; left: 50%; bottom: 100%; width: 3.5em; height: 3.5em; border: 2px solid #c9c1aa; border-color: #c9c1aa transparent transparent transparent; border-radius: 50%; transform: translate(-90%, 60%) rotate(-30deg); }
.pc-quit { position: absolute; left: 0; bottom: 0; font: 600 .7em/1 var(--mono) !important; letter-spacing: .1em; padding: .8em 1.2em !important; min-height: 0 !important; }
@media (prefers-reduced-motion: reduce) { #pc, .pc-rig, .pk { transition: none; } .pc-led.on { animation: none; } }

/* 对话框里的建议说法 */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.chips .hint { font: 11px/1 var(--mono); margin-right: 2px; }
.chips button { min-height: 0; padding: 6px 10px; border-radius: 14px; font: 12px/1.2 var(--mono); cursor: pointer;
  background: rgba(143,245,210,.07); color: var(--ph); border: 1px solid var(--ph-faint); box-shadow: none; text-shadow: none; }
.chips button:hover { background: rgba(143,245,210,.16); color: var(--ph-hi); }
.chips button:focus-visible { outline: 2px solid var(--ph); outline-offset: 2px; }
.sheet.phone .chips { margin: 4px 0 2px; }
</style>
</head>
<body>
<div id="app">
  <div class="viewport">
    <canvas id="c"></canvas>
      <div id="boot" hidden>
        <div class="term" role="dialog" aria-label="住家入住终端">
          <div class="crt" id="bootCrtBox" data-p="0">
            <div class="crt-art" id="bootArt"></div>
            <div class="crt-dim"></div>
            <div class="crt-roll"></div>
            <div class="crt-noise" id="bootNoise"></div>
            <div class="crt-scan"></div>
            <div class="crt-vignette"></div>
            <div class="crt-glass"></div>
            <div class="crt-flicker"></div>
            <div class="crt-text" id="bootCrt"></div>
          </div>
          <img class="term-face" id="bootFace" alt="">
          <button class="knob" id="bootKnob" type="button" data-p="0" aria-label="切换屏幕页面"><span class="knob-ptr"></span></button>
          <span class="k-lab" data-i="0">简介</span>
          <span class="k-lab" data-i="1">操作</span>
          <span class="k-lab" data-i="2">档案</span>
          <button class="led" id="bootLed" type="button" title="AI 设置"><i></i><span>AI</span></button>
          <button class="round" id="bootAi" type="button" title="AI 设置" aria-label="AI 设置"></button>
          <span class="r-lab">AI</span>
          <span class="keys-lab">住 户</span>
          <button class="key key-in" id="bootIn" type="button">入住</button>
          <button class="key key-out" id="bootOut" type="button">继续</button>
          <span class="v-lab">FABLE · 住家</span>
          <span class="p-lab">住家 · 入住终端<b id="bootStat">待入住 · 17:40</b></span>
        </div>
        <div class="boot-hint">转动旋钮（或 ← →）切换页面 · 回车开始</div>
      </div>
    <div class="hud">
      <div class="slate">
        <div class="clap"></div>
        <div class="body">
          <div class="title">住进来的第三天</div>
          <div class="meta" id="daychip">短租第 0 天 · FABLE</div>
          <div class="clock" id="clock">21:00</div>
        </div>
      </div>
      <div class="rulecard" id="rulecard">
        <div class="seal" id="sealn">住<br>则</div>
        <h2 id="ruletitle">住户须知</h2>
        <p id="rulebody">请先签署短租协议。</p>
      </div>
      <div class="clues" id="clues">
        <h3>调查笔记</h3>
        <ul id="cluelist"><li>尚未发现异常。</li></ul>
      </div>
      <div class="hero disk" id="hero" role="status" aria-label="原始记录进度">
        <div class="dk-face" id="badge" aria-hidden="true"></div>
        <div class="dk-grunge" aria-hidden="true"></div>
        <div class="dk-band" aria-hidden="true"></div>
        <div class="dk-label">
          <b class="dk-arrow" aria-hidden="true"></b>
          <div class="dk-inner">
            <canvas class="dk-title" id="dkTitle" aria-hidden="true"></canvas>
            <div class="dk-code">ZL·0217</div>
            <div class="dk-tag">
              <div class="dk-n" id="plabel">0 / 6</div>
              <div class="dk-sub">原始记录<br>RAW LOG</div>
              <div class="dk-bar"><div class="dk-fill" id="pfill"></div></div>
            </div>
          </div>
        </div>
        <div class="dk-win" aria-hidden="true"></div>
        <div class="dk-top" aria-hidden="true"><div class="dk-disc"></div><i class="dk-ring"></i></div>
        <i class="dk-hub" aria-hidden="true"></i>
        <i class="dk-wp dk-wp-l" aria-hidden="true"></i><i class="dk-wp dk-wp-r" aria-hidden="true"></i>
      </div>
      <div class="dock" id="dock"></div>
      <div class="obj" id="objbox">
        <h3 id="objtitle">今日目标</h3>
        <p id="objbody">熟悉公寓。</p>
      </div>
      <div class="prompt" id="prompt"></div>
      <div class="keyhint" aria-hidden="true">WASD / 方向键 移动 · E 互动 · 对话中按住空格说话</div>
      <div id="toast"></div>
      <div id="rkDark" aria-live="assertive"></div>
      <div class="modal" id="modal"></div>
    </div>
  </div>
</div>

</body>
